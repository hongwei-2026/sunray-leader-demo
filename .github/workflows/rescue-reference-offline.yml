name: Rescue Reference Offline Regression
on:
  pull_request:
    paths: ['rescue_reference/**', '.github/workflows/rescue-reference-offline.yml']
  push:
    branches: [main, develop]
    paths: ['rescue_reference/**', '.github/workflows/rescue-reference-offline.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s rescue_reference/assignment/ci/tasks/rescue_offline/tests -v
      - run: python -m unittest discover -s rescue_reference/tests -v
      - run: python rescue_reference/run_regression.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-reference-results
          path: rescue_reference/results/offline_report.json
          retention-days: 14
